<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>menu</title>
    <style>

       * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #click {
            cursor: pointer;
            user-select: none;
            background-color: #333;
            color: white;
            padding: 12px 16px;
            width: 180px;
            border-radius: 6px;
            font-family: sans-serif;
        }

        #menu {
            list-style: none;
            width: 180px;
            background-color: #f9f9f9;
            border-radius: 6px;
            margin-top: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            
            /* Masqué par défaut */
            display: none;
        }

        /* Classe ajoutée lors de l'ouverture pour déclencher l'animation */
        #menu.show {
            display: block;
            animation: fadeIn 0.3s ease-in-out forwards;
        }

        /* Keyframes pour l'effet d'apparition */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #menu li {
            padding: 10px 16px;
            border-bottom: 1px solid #eee;
            font-family: sans-serif;
            cursor: pointer;
        }

        #menu li:hover {
            background-color: #e0e0e0;
        }
        
    </style>
</head>
<body>

   
    <h2 id="click">Menu</h2>
    <ul id="menu">
        <li>Home</li>
        <li>about</li>
        <li>contact</li>
        <li>experience</li>
    </ul>

    <script>

        const button = document.getElementById("click");
        const menu = document.getElementById("menu");

        button.onclick = function()
        {
            if(menu.style.display=="none"|| menu.style.display === "")
            {
                menu.style.display="block";
                menu.classList.add("show");
            }
            else
            menu.style.display="none";
            menu.classList.remove("show");
        };
    </script>
</body>
</html>
