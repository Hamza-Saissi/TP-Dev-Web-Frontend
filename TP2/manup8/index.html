<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>timer</title>
    <style>

        body
        {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container
        {
            text-align: center;
            width: 300px;
            height: 100px;
            background-color: rgb(211, 201, 201);
        }
    </style>
</head>


<body>
        <div class="container">

            <h2 id="global">temps écoulé: 0 secondes</h2>
        </div>


        <script>
            let currentTime= 0;
            let content = document.getElementById("global");
         setInterval(function() {
            currentTime++;
            content.textContent = "temps écoulé: " + currentTime + " secondes";
        }, 1000);
        </script>
</body>
</html>
