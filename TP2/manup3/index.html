<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  
</head>
<body>
    <form id="form" action="">
        
             <label for="nom">nom</label>
        <input id="nom" type="text" placeholder="entrer le nom">
        <label for="email">email</label>
        <input id="email" type="text" placeholder="entrer votre email">
        <button id="btn" type="button">valider</button>
      
       
    </form>
    <script>
        const form = document.getElementById("form");
        let nom = form.elements[0];    // Le champ input 'nom'
        let email = form.elements[1];  // Le champ input 'email'
        let button = form.elements[2]; // Le bouton 'valider'
        button.onclick=function()
        {
            if(nom.value.trim()=="" || email.value.trim() =="")
        {
            alert("veuillez remplir tous les champs");
        }
        else
        alert("les champs sont remplis avec succès");
        };
        
    </script>
</body>
</html>
