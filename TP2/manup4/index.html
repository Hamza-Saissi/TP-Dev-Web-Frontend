<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container
        {
            display: flex;
            flex-direction: column;
            width: fit-content;
            
        }
       

        .buttons
        {
            margin-top: 20px;
        }
        .buttons button
        {
            padding-right: 20px;
        }
    </style>
</head>
<body>
    <h2>Calculator</h2>
    <div class="container">
  <input type="number" id="num1" placeholder="premier nombre">
        <input type="number" id="num2" placeholder="deuxieme nombre">



    </div>
    <div class="buttons">

        <button id="addition">+</button>
        <button id="multiplication">*</button>
        <button id="substruction">-</button>
        <button id="division">/</button>

    </div>
    <h3 id="result">result:</h3>
      
    
    
    <script>
        let result = document.getElementById("result");
        let num1 = document.getElementById("num1");
        let num2 = document.getElementById("num2");
        let addition =document.getElementById("addition");
        let multiplication = document.getElementById("multiplication");
        let substruction = document.getElementById("substruction");
        let division = document.getElementById("division");


        addition.onclick=function()
        {
             result.textContent ="result:"+ (parseFloat(num1.value) +parseFloat(num2.value));

            

        }
            multiplication.onclick=function()
        {
             result.textContent ="result:"+ (parseFloat(num1.value) *parseFloat(num2.value));

            

        }
            substruction.onclick=function()
        {
             result.textContent ="result:"+ (parseFloat(num1.value) -parseFloat(num2.value));

            

        }
            division.onclick=function()
        {
            

            
            if(parseFloat(num2.value))
            {
                result.textContent ="error";
            }
            else
             result.textContent ="result:"+ (parseFloat(num1.value)/parseFloat(num2.value));
        }

    </script>
</body>
</html>
