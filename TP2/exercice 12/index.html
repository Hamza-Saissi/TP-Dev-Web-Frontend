<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Responsive avec JavaScript</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        h3 {
            margin-bottom: 15px;
        }
        #conteneur {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .boite {
            background-color: #3498db;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 6px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h3>Responsive Page avec JavaScript</h3>
    <div id="conteneur">
        <div class="boite">Boîte 1</div>
        <div class="boite">Boîte 2</div>
        <div class="boite">Boîte 3</div>
        <div class="boite">Boîte 4</div>
    </div>
    <script>
        const conteneur = document.getElementById("conteneur");
        function adapterLayout() {
            const largeurEcran = window.innerWidth;
            if (largeurEcran < 768) {
                conteneur.style.gridTemplateColumns = "1fr";
            }
            else {
                conteneur.style.gridTemplateColumns = "1fr 1fr";
            }
        }
        window.addEventListener("resize", adapterLayout);
        adapterLayout();
    </script>
</body>
</html>
