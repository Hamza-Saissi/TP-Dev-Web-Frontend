<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>To-do list interactive</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            margin: 40px;
        }
        .conteneur {
            border: 3px solid black;
            padding: 15px;
            width: 320px;
        }
        input[type="text"] {
            padding: 4px;
            width: 180px;
        }
        button {
            padding: 4px 10px;
            margin-left: 4px;
            cursor: pointer;
        }
        ul {
            margin-top: 15px;
            padding-left: 25px;
        }
        li {
            margin-bottom: 5px;
            font-size: 18px;
        }
        /* Style pour marquer une tâche comme faite */
        .faite {
            text-decoration: line-through;
            color: gray;
        }
        .texte-tache {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="conteneur">
        <input type="text" id="tacheInput" placeholder="Ajouter une tâche">
        <button onclick="ajouterTache()">Ajouter</button>
        <ul id="listeTaches"></ul>
    </div>
    <script>
        function ajouterTache() {
            const input = document.getElementById("tacheInput");
            const texte = input.value.trim();
            if (texte === "") {
                alert("Veuillez saisir une tâche !");
                return;
            }
            const ul = document.getElementById("listeTaches");
            const li = document.createElement("li");
            const span = document.createElement("span");
            span.textContent = texte + " ";
            span.className = "texte-tache";
            span.onclick = function() {
                span.classList.toggle("faite");
            };
            const btnSupprimer = document.createElement("button");
            btnSupprimer.textContent = "Supprimer";
            btnSupprimer.onclick = function() {
                ul.removeChild(li);
            };
            li.appendChild(span);
            li.appendChild(btnSupprimer);
            ul.appendChild(li);
            input.value = "";
            input.focus();
        }
    </script>
</body>
</html>
