<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculatrice</title>

    <style>
       body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        .containner {
            width: 260px;
            padding: 15px;
            background-color: #ffffff;
            border: 2px solid #333;
            border-radius: 12px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Écran de résultat */
        #result {
            grid-column: span 4;
            height: 45px;
            background-color: #ffffff;
            border: 1px solid #aaa;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 10px;
            font-size: 22px;
            font-weight: bold;
            color: #000;
            margin-bottom: 8px;
            word-break: break-all;
        }

        /* Style des boutons */
        button {
            height: 45px;
            font-size: 18px;
            border: 1px solid #bbb;
            background-color: #eee;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.1s;
        }

        button:active {
            background-color: #ccc;
        }

        /* Le bouton 0 prend 2 colonnes comme sur l'image */
        #num0 {
            grid-column: span 2;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="containner">
<div id="result"></div>
        <button id="C">C</button>
        <button id="effacer">&#9003;</button>
        <button id="division">/</button>
        <button id="multiplacation">*</button>
        
        <button id="num7">7</button>
        <button id="num8">8</button>
        <button id="num9">9</button>
        <button id="substraction">-</button>

        <button id="num4">4</button>
        <button id="num5">5</button>
        <button id="num6">6</button>
        <button id="addition">+</button>

        <button id="num1">1</button>
        <button id="num2">2</button>
        <button id="num3">3</button>
        
        <!-- Le '=' est placé ici et s'étend vers le bas grâce à grid-row: span 2 -->
        <button id="equal">=</button>

        <button id="num0">0</button>
        <button id="point">.</button>
        <script>
            const result = document.getElementById("result");
            document.getElementById("num0").onclick = function() { result.textContent += "0"; };
        document.getElementById("num1").onclick = function() { result.textContent += "1"; };
        document.getElementById("num2").onclick = function() { result.textContent += "2"; };
        document.getElementById("num3").onclick = function() { result.textContent += "3"; };
        document.getElementById("num4").onclick = function() { result.textContent += "4"; };
        document.getElementById("num5").onclick = function() { result.textContent += "5"; };
        document.getElementById("num6").onclick = function() { result.textContent += "6"; };
        document.getElementById("num7").onclick = function() { result.textContent += "7"; };
        document.getElementById("num8").onclick = function() { result.textContent += "8"; };
        document.getElementById("num9").onclick = function() { result.textContent += "9"; };
        document.getElementById("point").onclick = function() { result.textContent += "."; };

        // 2. Boutons des opérations
        document.getElementById("addition").onclick = function() { result.textContent += "+"; };
        document.getElementById("substraction").onclick = function() { result.textContent += "-"; };
        document.getElementById("multiplacation").onclick = function() { result.textContent += "*"; };
        document.getElementById("division").onclick = function() { result.textContent += "/"; };

        // 3. Bouton Réinitialiser (C)
        document.getElementById("C").onclick = function() {
            result.textContent = "";
        };
        document.getElementById("effacer").onclick = function() {
            result.textContent = result.textContent.slice(0, -1);
        };
        document.getElementById("equal").onclick=function()
        {
            result.textContent = eval(result.textContent);
        }
        </script>
</body>
</html>
