<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modal de notification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-contenu {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            width: 350px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .btn-fermer {
            margin-top: 15px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <button id="btnOuvrir">Ouvrir</button>
    <div id="maModale" class="modal-overlay">
        <div class="modal-contenu">
            <h3>Notification</h3>
            <p>Dialogue.</p>
            <button id="btnFermer" class="btn-fermer">Fermer</button>
        </div>
    </div>
    <script>
        const modale = document.getElementById("maModale");
        const btnOuvrir = document.getElementById("btnOuvrir");
        const btnFermer = document.getElementById("btnFermer");
        btnOuvrir.addEventListener("click", function() {
            modale.style.display = "flex";
        });
        btnFermer.addEventListener("click", function() {
            modale.style.display = "none";
        });
    </script>
</body>
</html>
