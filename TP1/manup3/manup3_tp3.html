<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
                        
            function sorting()
            {
                var tab= [5,2,9,1,7,3,0];
                document.write("before sorting:"+"["+tab+"]");
                for(var i =0;i<tab.length-1;i++)
            {
                for(var j=0;j<tab.length-i-1;j++)
            {
                if(tab[j]>tab[j+1])
            {
                var temp=tab[j];
                tab[j]=tab[j+1];
                tab[j+1]=temp;
            }
            }
            }
            document.write("after sorting:"+"["+tab+"]");
            }
            sorting();
    </script>
</body>
</html>
