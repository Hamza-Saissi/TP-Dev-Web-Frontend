<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Somme de trois mesures de temps</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            font-size: 18px;
            margin: 30px;
        }
        .ligne {
            margin-bottom: 10px;
        }
        input[type="number"], input[type="text"] {
            width: 80px;
            margin-right: 10px;
            padding: 3px;
        }
        .boutons {
            margin-top: 15px;
            margin-left: 220px;
        }
        button, input[type="reset"] {
            padding: 6px 15px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <form id="formTemps">
        <div>Entrer le premier temps :</div>
        <div class="ligne">
            Heure(s) <input type="number" id="h1" value="0">
            Minute(s) <input type="number" id="m1" value="0">
            Seconde(s) <input type="number" id="s1" value="0">
        </div>
        <div>Entrer le Deuxième temps :</div>
        <div class="ligne">
            Heure(s) <input type="number" id="h2" value="0">
            Minute(s) <input type="number" id="m2" value="0">
            Seconde(s) <input type="number" id="s2" value="0">
        </div>
        <div>Entrer le troisième temps :</div>
        <div class="ligne">
            Heure(s) <input type="number" id="h3" value="0">
            Minute(s) <input type="number" id="m3" value="0">
            Seconde(s) <input type="number" id="s3" value="0">
        </div>
        <div>Total des trois temps :</div>
        <div class="ligne">
            Jour(s) <input type="text" id="totalJ" readonly style="width: 50px;">
            Heure(s) <input type="text" id="totalH" readonly>
            Minute(s) <input type="text" id="totalM" readonly>
            Seconde(s) <input type="text" id="totalS" readonly>
        </div>
        <div class="boutons">
            <button type="button" onclick="calculerSomme()">Somme</button>
            <input type="reset" value="Effacer">
        </div>
    </form>
    <script>
        function calculerSomme() {
            let h1 = parseInt(document.getElementById("h1").value) || 0;
            let m1 = parseInt(document.getElementById("m1").value) || 0;
            let s1 = parseInt(document.getElementById("s1").value) || 0;

            let h2 = parseInt(document.getElementById("h2").value) || 0;
            let m2 = parseInt(document.getElementById("m2").value) || 0;
            let s2 = parseInt(document.getElementById("s2").value) || 0;

            let h3 = parseInt(document.getElementById("h3").value) || 0;
            let m3 = parseInt(document.getElementById("m3").value) || 0;
            let s3 = parseInt(document.getElementById("s3").value) || 0;
            let totalSecondes = s1 + s2 + s3;
            let totalMinutes = m1 + m2 + m3;
            let totalHeures = h1 + h2 + h3;
            let secondesFinales = totalSecondes % 60;
            totalMinutes += Math.floor(totalSecondes / 60);
            let minutesFinales = totalMinutes % 60;
            totalHeures += Math.floor(totalMinutes / 60);
            let heuresFinales = totalHeures % 24;
            let joursFinaux = Math.floor(totalHeures / 24);
            document.getElementById("totalJ").value = joursFinaux;
            document.getElementById("totalH").value = heuresFinales;
            document.getElementById("totalM").value = minutesFinales;
            document.getElementById("totalS").value = secondesFinales;
        }
    </script>
</body>
</html>
